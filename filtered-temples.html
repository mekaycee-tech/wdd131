<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtered Temple Picture Album</title>
    
    <!-- Meta tags for validation and SEO -->
    <meta name="description" content="A simple photo album showing different temples around the world with filter options.">
    <meta name="author" content="Student Developer">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- External CSS files -->
    <link rel="stylesheet" href="styles/filtered-temples.css">
    <link rel="stylesheet" href="styles/filtered-temples-large.css" media="(min-width: 640px)">
    
    <!-- External JavaScript file -->
    <script src="scripts/filtered-temples.js" defer></script>
</head>
<body>

    <header>
        <h1>Temple Album</h1>
        <!-- Button to open mobile menu -->
        <button id="menuButton" aria-label="Toggle navigation menu">&#9776;</button>
        <nav id="navMenu">
            <a href="#" id="home" class="active">Home</a>
            <a href="#" id="old">Old</a>
            <a href="#" id="new">New</a>
            <a href="#" id="large">Large</a>
            <a href="#" id="small">Small</a>
        </nav>
    </header>

    <main>
        <h2 id="filterHeading">Home</h2>
        <!-- Empty container where JS will place the temple cards -->
        <div id="templeContainer" class="grid-container"></div>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> 🌺 Student Developer 🌺</p>
        <p class="last-modified">Last Modified: <span id="modifiedDate"></span></p>
    </footer>

</body>
</html>
